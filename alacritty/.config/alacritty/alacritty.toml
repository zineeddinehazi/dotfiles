[shell]
program = "wsl"
args=["~","-d","Arch"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font]
size = 13

[scrolling]
history = 1000

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"
foreground = "#D0D0D0"

[colors.cursor]
text = "#000000"
cursor = "#D0D0D0"

[colors.selection]
text = "CellForeground"
background = "#2A2A2A"

[colors.normal]
black   = "#1A1A1A"
red     = "#D16969"
green   = "#98C379"
yellow  = "#E5C07B"
blue    = "#61AFEF"
magenta = "#C678DD"
cyan    = "#56B6C2"
white   = "#D0D0D0"

[colors.bright]
black   = "#5C6370"
red     = "#E06C75"
green   = "#A6E3A1"
yellow  = "#F2CC60"
blue    = "#7AB6FF"
magenta = "#D7A1F9"
cyan    = "#6FE1E8"
white   = "#FFFFFF"

[colors.dim]
black   = "#101010"
red     = "#A84F4F"
green   = "#6E9F57"
yellow  = "#B38E5C"
blue    = "#4C8CC7"
magenta = "#A65BC1"
cyan    = "#3F8E99"
white   = "#A8A8A8"


